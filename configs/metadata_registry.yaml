# OpenMetadata Connection Configuration
version: "1.0"
project: DEApython
host: http://localhost:8585

services:
  database:
    bigquery_source:
      name: bigquery_source
      type: BigQuery
      description: Brazilian public datasets

    postgres_warehouse:
      name: postgres_warehouse
      type: Postgres
      description: Analytics warehouse

  storage:
    gcs_bucket:
      name: gcs_lakehouse
      type: GCS
      description: DEA medallion lakehouse
      connection:
        config:
          type: GCS
          credentials:
            gcpConfig:
              type: service_account

  dashboard:
    powerbi_analytics:
      name: powerbi_analytics
      type: PowerBI
      description: Analytics dashboard

tables:
  population:
    service: bigquery_source
    database: basedosdados
    schema: public
    name: population
    description: Population data from IBGE

  gdp:
    service: bigquery_source
    database: basedosdados
    schema: public
    name: gdp
    description: GDP data from IBGE

  education_spending:
    service: bigquery_source
    database: basedosdados
    schema: public
    name: education_spending
    description: Education spending data from SICONFI

  enrollments:
    service: bigquery_source
    database: basedosdados
    schema: public
    name: enrollments
    description: School enrollment data from INEP

  ideb:
    service: bigquery_source
    database: basedosdados
    schema: public
    name: ideb
    description: IDEB educational quality index

  dropout_rates:
    service: bigquery_source
    database: basedosdados
    schema: public
    name: dropout_rates
    description: School dropout rates from INEP

containers:
  bronze_layer:
    service: gcs_bucket
    description: Raw data ingestion layer at GCP://deapython/bronze/

  silver_layer:
    service: gcs_bucket
    description: Aggregated cleaned data at GCP://deapython/silver/

  gold_layer:
    service: gcs_bucket
    description: DEA results at GCP://deapython/gold/

dashboards:
  powerbi_dashboard:
    service: powerbi_analytics
    description: DEA analytics dashboard

lineage:
  - from: population
    to: bronze_layer
  - from: gdp
    to: bronze_layer
  - from: education_spending
    to: bronze_layer
  - from: enrollments
    to: bronze_layer
  - from: ideb
    to: bronze_layer
  - from: dropout_rates
    to: bronze_layer
  - from: bronze_layer
    to: silver_layer
  - from: silver_layer
    to: gold_layer
  - from: gold_layer
    to: gold_dataset
  - from: gold_dataset
    to: powerbi_dashboard