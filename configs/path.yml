# path.yml
# Paths for data ingestion and outputs
data_directories:
  root: "data"

bronze:
  local_path: "data/raw/bronze"
  gcs_path: "gs://your-bucket/bronze"
  tables:
    - population
    - pib
    - education_spending
    - enrollments
    - ideb
    - dropout_rates

silver:
  local_path: "data/processed/silver"
  gcs_path: "gs://your-bucket/silver"
  output_filename: "silver_data"

gold:
  local_path: "data/processed/gold"
  gcs_path: "gs://your-bucket/gold"
  output_filename:
    gold_data: "gold_data_complete"

data:
  raw: "data/raw"
  processed: "data/processed"
  output: "data/output"

files:
  gold_input: "data/processed/gold/gold_data_complete_cases.csv"
  dea_results: "data/output/DEA_Analysis"
  dea_summary: "data/output/DEA_Summary"

