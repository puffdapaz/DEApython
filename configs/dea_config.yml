# dea_config.yml
# DEA configuration parameters
general:
  years: [2017, 2019]

validation:
  bronze:
    required_tables:
      - population
      - pib
      - education_spending
      - enrollments
      - ideb
      - dropout_rates
  silver:
    required_columns:
      - id_municipio
      - sigla_uf
      - ano
      - nome
      - populacao
      - pib
      - gastos_educacao
      - quantidade_matricula
      - ideb_iniciais
      - ideb_finais
      - taxa_abandono_ef_anos_iniciais
      - taxa_abandono_ef_anos_finais
      - pib_per_capita
      - gasto_por_aluno
  gold:
    required_dea_columns:
      - DEA_crs_input
      - DEA_crs_output
      - DEA_vrs_input
      - DEA_vrs_output
      - DEA_irs_input
      - DEA_drs_input
      - DEA_scale_efficiency
      - DEA_returns_nature

dea_analysis:
  input_vars:
    - pib_per_capita
    - gasto_por_aluno
  output_vars:
    - ideb_iniciais
    - ideb_finais
    - taxa_abandono_ef_anos_iniciais
    - taxa_abandono_ef_anos_finais
  rts:
    crs: "constant"
    vrs: "variable"
    irs: "increasing"
    drs: "decreasing"
  orientation:
    input: "input"
    output: "output"
